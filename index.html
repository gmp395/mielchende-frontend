<!DOCTYPE html>
<!-- lang="es": los lectores de pantalla y los traductores saben que la web está en español -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: el logo de Miel Chende (está en la carpeta public) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Icono que usan iPhone e iPad al guardar la web en la pantalla de inicio -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Adapta la página al ancho real del móvil (imprescindible para el responsive) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Descripción que muestran los buscadores bajo el título -->
    <meta
      name="description"
      content="Miel Chende: miel artesanal de cosecha propia de Apícola Chende, en Galicia."
    />

    <!-- Preconnect: abre antes la conexión con los servidores de Google Fonts para que las fuentes carguen más rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fuentes del diseño:
      - Fraunces (títulos, con remates), normal y cursiva, grosores 300 a 700
      - Karla (texto general, sin remates), grosores 400 a 700
      display=swap: muestra el texto con la fuente de reserva mientras se descarga la buena, sin dejar la página en blanco
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Karla:wght@400..700&display=swap"
    />

    <!-- Título de la pestaña del navegador -->
    <title>Miel Chende — Miel artesanal</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
